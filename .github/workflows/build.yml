name: Build timestamp_by_putra APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Configure Android Permissions, MediaStore & Lint
        shell: bash
        run: |
          mkdir -p android/app/src/main
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android .
          fi

          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"

          if [ -f "$GRADLE_KTS" ]; then
            python3 - <<'EOF'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          txt = p.read_text(encoding="utf-8")
          if "lint {" not in txt and "checkReleaseBuilds = false" not in txt:
              txt += "\nandroid {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n}\n"
              p.write_text(txt, encoding="utf-8")
          EOF
          elif [ -f "$GRADLE_GROOVY" ]; then
            python3 - <<'EOF'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          txt = p.read_text(encoding="utf-8")
          if "lint {" not in txt and "checkReleaseBuilds false" not in txt:
              txt += "\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n"
              p.write_text(txt, encoding="utf-8")
          EOF
          fi

      - name: Set Custom App Launcher Icon
        shell: bash
        run: |
          ICON_SRC="assets/icon/app_icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "ERROR: $ICON_SRC tidak ditemukan di repository!"
            exit 1
          fi
          if ! file "$ICON_SRC" | grep -qi "PNG image"; then
            echo "ERROR: $ICON_SRC bukan file PNG asli!"
            file "$ICON_SRC" || true
            exit 1
          fi

          if command -v python3 >/dev/null 2>&1 && python3 -c "import PIL" 2>/dev/null; then
            python3 - <<'EOF'
          from PIL import Image
          import os

          src = "assets/icon/app_icon.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in sizes.items():
              out_dir = os.path.join("android/app/src/main/res", folder)
              os.makedirs(out_dir, exist_ok=True)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), format="PNG")
          print("Berhasil generate ic_launcher.png ke seluruh folder mipmap.")
          EOF
          else
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f "$ICON_SRC" "$d/ic_launcher.png"
              fi
            done
            echo "Menyalin app_icon.png langsung ke folder mipmap-*."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp_by_putra-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
