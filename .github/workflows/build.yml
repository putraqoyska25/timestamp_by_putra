name: Build Timestamp Camera APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"

      - name: Ensure Android project & permissions exist
        run: |
          chmod +x scripts/setup_android.sh
          ./scripts/setup_android.sh

      - name: Verify custom launcher icon assets exist
        run: |
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Ensure applicationId is com.putra.timestamp_by_putra
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import re

          for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if p.exists():
                  txt = p.read_text(encoding="utf-8")
                  txt = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.putra.timestamp_by_putra"', txt)
                  txt = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.putra.timestamp_by_putra"', txt)
                  p.write_text(txt, encoding="utf-8")
          PY

      - name: Disable lintVitalAnalyzeRelease in Gradle
        run: |
          python3 - << 'PY'
          from pathlib import Path

          for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if p.exists():
                  txt = p.read_text(encoding="utf-8")
                  if "disable.add(\"LintVitalAnalyzeRelease\")" not in txt and "lint {" in txt:
                      txt = txt.replace(
                          "lint {",
                          'lint {\n        disable.add("LintVitalAnalyzeRelease")',
                          1,
                      )
                      p.write_text(txt, encoding="utf-8")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-by-putra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
