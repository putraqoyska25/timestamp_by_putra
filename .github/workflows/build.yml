name: Build Timestamp by Putra APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Install Pillow for icon generation
        run: python3 -m pip install --upgrade pip && pip install pillow

      - name: Run Android setup script
        run: |
          chmod +x scripts/setup_android.sh
          ./scripts/setup_android.sh

      - name: Verify launcher icons
        run: |
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png
          ls -la android/app/src/main/res/mipmap-*/ic_launcher_round.png

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Ensure Android SDK 36 platform & build-tools if available
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/cmdline-tools/bin:$SDK_DIR/platform-tools:$PATH"

          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
          else
            echo "sdkmanager tidak ditemukan di PATH; melewati instalasi manual SDK dan menyerahkan ke Flutter/Gradle."
          fi

      - name: Ensure applicationId, embedding v2, and disable LintVitalAnalyzeRelease
        run: |
          python3 - << 'PY'
          import os, re, xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
              ET.register_namespace('tools', 'http://schemas.android.com/tools')
              ns_android = 'http://schemas.android.com/apk/res/android'
              ns_tools = 'http://schemas.android.com/tools'
              name_attr = f"{{{ns_android}}}name"
              val_attr = f"{{{ns_android}}}value"

              tree = ET.parse(manifest_path)
              root = tree.getroot()
              if f"{{{ns_tools}}}tools" not in root.attrib and "xmlns:tools" not in root.attrib:
                  root.set("xmlns:tools", ns_tools)

              app = root.find("application")
              if app is not None:
                  nodes = [m for m in list(app.findall("meta-data")) if m.attrib.get(name_attr) == "flutterEmbedding"]
                  if nodes:
                      nodes[0].set(val_attr, "2")
                      for extra in nodes[1:]:
                          app.remove(extra)
                  else:
                      app.append(ET.Element("meta-data", {name_attr: "flutterEmbedding", val_attr: "2"}))
                  tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

          for gradle_path in [
              "android/app/build.gradle",
              "android/app/build.gradle.kts",
          ]:
              if not os.path.exists(gradle_path):
                  continue
              with open(gradle_path, "r", encoding="utf-8") as f:
                  content = f.read()

              if gradle_path.endswith(".kts"):
                  if 'applicationId = "com.putra.timestamp_by_putra"' not in content:
                      content = re.sub(
                          r'applicationId\s*=\s*"[^"]+"',
                          'applicationId = "com.putra.timestamp_by_putra"',
                          content,
                      )
                  if "LintVitalAnalyzeRelease" not in content:
                      lint_block = (
                          "\nandroid {\n"
                          "    lint {\n"
                          '        disable += "LintVitalAnalyzeRelease"\n'
                          "        checkReleaseBuilds = false\n"
                          "    }\n"
                          "}\n"
                      )
                      content = content + lint_block
              else:
                  if 'applicationId "com.putra.timestamp_by_putra"' not in content:
                      content = re.sub(
                          r'applicationId\s+"[^"]+"',
                          'applicationId "com.putra.timestamp_by_putra"',
                          content,
                      )
                  if "LintVitalAnalyzeRelease" not in content:
                      lint_block = (
                          "\nandroid {\n"
                          "    lint {\n"
                          "        disable 'LintVitalAnalyzeRelease'\n"
                          "        checkReleaseBuilds false\n"
                          "    }\n"
                          "}\n"
                      )
                      content = content + lint_block

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(content)
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-by-putra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
