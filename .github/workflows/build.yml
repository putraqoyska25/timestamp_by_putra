name: Build timestamp_by_putra APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Structure
        run: flutter create --platforms=android --org=com.putra --project-name=timestamp_by_putra .

      - name: Configure Android Permissions, MediaStore & Lint
        run: bash scripts/setup_android.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: timestamp-by-putra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
