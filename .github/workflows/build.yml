name: Build APK Timestamp by Putra

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Run Android setup script
        run: |
          chmod +x scripts/setup_android.sh
          ./scripts/setup_android.sh

      - name: Ensure Android project & Kotlin compatibility
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.putra --project-name timestamp_by_putra .
            chmod +x scripts/setup_android.sh
            ./scripts/setup_android.sh
          fi

          python3 - <<'PY'
from pathlib import Path
import re

for fname in ["android/settings.gradle", "android/settings.gradle.kts"]:
    p = Path(fname)
    if p.exists():
        txt = p.read_text(encoding="utf-8")
        new_txt = re.sub(
            r'(id\s+[\'"]org\.jetbrains\.kotlin\.android[\'"]\s+version\s+[\'"])2\.[23]\.[0-9a-zA-Z._-]+([\'"])',
            r'\g<1>2.1.0\g<2>',
            txt,
        )
        if new_txt != txt:
            p.write_text(new_txt, encoding="utf-8")
            print(f"Updated Kotlin version in {fname}")

for fname in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
    p = Path(fname)
    if p.exists():
        txt = p.read_text(encoding="utf-8")
        if "abortOnError" not in txt:
            lint_block = """
android {
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
"""
            p.write_text(txt + "\n" + lint_block, encoding="utf-8")
            print(f"Added lint config to {fname}")
PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-by-putra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
