name: Build timestamp_by_putra APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android Permissions, MediaStore & Lint
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org com.putra --project-name timestamp_by_putra .
          fi

          if [ ! -f scripts/setup_android.sh ]; then
            echo "ERROR: scripts/setup_android.sh tidak ditemukan di repository!"
            exit 1
          fi

          chmod +x scripts/setup_android.sh
          ./scripts/setup_android.sh

          python3 - << 'PY'
          from pathlib import Path
          import re

          target_pkg = "com.putra.timestamp_by_putra"
          for gradle_path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              p = Path(gradle_path)
              if not p.exists():
                  continue
              txt = p.read_text(encoding="utf-8")
              is_kts = gradle_path.endswith(".kts")
              sep = " = " if is_kts else " "

              if re.search(r"namespace\s*=", txt):
                  txt = re.sub(r'namespace\s*=\s*"[^"]+"', f'namespace = "{target_pkg}"', txt, count=1)
              elif re.search(r"namespace\s+", txt):
                  txt = re.sub(r'namespace\s+["\'][^"\']+["\']', f'namespace "{target_pkg}"', txt, count=1)

              if re.search(r"applicationId\s*=", txt):
                  txt = re.sub(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{target_pkg}"', txt, count=1)
              elif re.search(r"applicationId\s+", txt):
                  txt = re.sub(r'applicationId\s+["\'][^"\']+["\']', f'applicationId "{target_pkg}"', txt, count=1)

              if "checkReleaseBuilds" not in txt:
                  lint_block = (
                      f"    lint {{\n"
                      f"        checkReleaseBuilds{sep}false\n"
                      f"        abortOnError{sep}false\n"
                      f"    }}\n"
                  )
                  m = re.search(r"android\s*\{", txt)
                  if m:
                      idx = m.end()
                      txt = txt[:idx] + "\n" + lint_block + txt[idx:]
                  else:
                      txt += "\nandroid {\n" + lint_block + "}\n"

              p.write_text(txt, encoding="utf-8")

          kotlin_root = Path("android/app/src/main/kotlin")
          target_main = kotlin_root / "com/putra/timestamp_by_putra/MainActivity.kt"
          if kotlin_root.exists() and target_main.exists():
              for kt_file in kotlin_root.rglob("MainActivity.kt"):
                  if kt_file.resolve() != target_main.resolve():
                      kt_file.unlink()
          PY

      - name: Set Custom App Launcher Icon
        run: |
          set -euo pipefail
          ICON_SRC="assets/icon/app_icon.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "ERROR: $ICON_SRC tidak ditemukan di repository!"
            exit 1
          fi

          if ! file "$ICON_SRC" | grep -qi "PNG image"; then
            echo "ERROR: $ICON_SRC bukan file PNG asli!"
            file "$ICON_SRC" || true
            exit 1
          fi

          if command -v python3 >/dev/null 2>&1 && python3 -c "import PIL" 2>/dev/null; then
            python3 - << 'PY'
          from PIL import Image
          import os

          src = "assets/icon/app_icon.png"
          img = Image.open(src).convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in sizes.items():
              out_dir = os.path.join("android/app/src/main/res", folder)
              os.makedirs(out_dir, exist_ok=true)
              resized = img.resize((px, px), Image.Resampling.LANCZOS)
              resized.save(os.path.join(out_dir, "ic_launcher.png"), format="PNG")
          print("Berhasil generate ic_launcher.png ke seluruh folder mipmap.")
          PY
          else
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f "$ICON_SRC" "$d/ic_launcher.png"
              fi
            done
            echo "Menyalin app_icon.png langsung ke folder mipmap-*."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter build apk --release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp_by_putra-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
